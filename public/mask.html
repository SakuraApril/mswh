<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勾脸 · 技艺互动 | 薪火非遗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Cinzel:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://lib.baomitu.com/three.js/0.160.0/three.min.js"></script>
<script src="js/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #c9a96e;
    --gold-dim: rgba(201, 169, 110, 0.3);
    --ink: #0a0a0c;
    --paper: #e8dcc8;
    --text: #d4cdc0;
    --text-dim: #6b6558;
  }
  body, html { height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: 'Noto Serif SC', serif; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, rgba(201,169,110,0.08) 0%, transparent 60%);
  }
  #bg-canvas { position: fixed; inset: 0; z-index: 1; }

  .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.8rem 3.5rem; }
  .nav__logo { font-size: 0.9rem; letter-spacing: 0.3em; color: var(--gold); font-weight: 300; }
  .nav__links { display: flex; gap: 2.5rem; }
  .nav__links a { font-size: 0.78rem; color: var(--text-dim); text-decoration: none; letter-spacing: 0.2em; transition: color 0.3s; font-weight: 300; }
  .nav__links a:hover { color: var(--text); }
  .nav__links a.active { color: var(--gold); }

  .back-btn {
    position: fixed; top: 6rem; left: 3.5rem; z-index: 10;
    font-size: 0.78rem; color: var(--text-dim); text-decoration: none;
    letter-spacing: 0.2em; transition: color 0.3s;
  }
  .back-btn:hover { color: var(--gold); }

  .title-block { position: fixed; top: 8rem; left: 3.5rem; z-index: 10; }
  .title-block__main { font-size: 1.8rem; font-weight: 900; letter-spacing: 0.4em; color: var(--paper); line-height: 1.2; }
  .title-block__sub { margin-top: 0.8rem; font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.3em; font-family: 'Cinzel', serif; }
  .title-block__line { width: 40px; height: 1px; background: var(--gold); margin-top: 1rem; }

  .stage { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; }
  .face-container { position: relative; width: min(55vh, 420px); height: min(68vh, 520px); }
  .face-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 60px rgba(201,169,110,0.15)); }

  .region { cursor: pointer; transition: filter 0.25s; }
  .region:hover { filter: brightness(1.3) drop-shadow(0 0 8px rgba(255,255,255,0.2)); }
  .region path { transition: fill 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

  .color-picker { position: fixed; left: 3.5rem; top: 50%; transform: translateY(-50%); z-index: 20; }
  .color-picker__label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.3em; margin-bottom: 1.2rem; text-align: center; }
  .color-dots { display: flex; flex-direction: column; gap: 0.9rem; align-items: center; }
  .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); position: relative; }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.active { transform: scale(1.2); box-shadow: 0 0 20px currentColor; border-color: rgba(255,255,255,0.4); }
  .color-dot.active::after { content: ''; position: absolute; inset: -6px; border: 1px solid var(--gold-dim); border-radius: 50%; animation: ring 2s infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  .tools { position: fixed; right: 3.5rem; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 1.5rem; }
  .tool-section__label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.3em; margin-bottom: 0.8rem; text-align: right; }
  .preset-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .preset-item { padding: 0.6rem 1.2rem; background: transparent; border: 1px solid rgba(201,169,110,0.2); border-radius: 2px; color: var(--text-dim); font-size: 0.8rem; cursor: pointer; transition: all 0.3s; text-align: right; font-family: 'Noto Serif SC', serif; letter-spacing: 0.1em; }
  .preset-item:hover { background: rgba(201,169,110,0.08); border-color: var(--gold); color: var(--gold); }
  .action-row { display: flex; flex-direction: column; gap: 0.6rem; }
  .btn { padding: 0.7rem 1.5rem; border-radius: 2px; cursor: pointer; font-family: 'Noto Serif SC', serif; font-size: 0.8rem; letter-spacing: 0.2em; transition: all 0.3s; }
  .btn--primary { background: var(--gold); color: var(--ink); border: none; font-weight: 600; }
  .btn--primary:hover { box-shadow: 0 0 30px rgba(201,169,110,0.4); }
  .btn--ghost { background: transparent; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.15); }
  .btn--ghost:hover { border-color: var(--text-dim); color: var(--text); }

  .knowledge { position: fixed; left: 3.5rem; bottom: 3rem; z-index: 10; max-width: 260px; }
  .knowledge__title { font-size: 0.75rem; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 0.5rem; }
  .knowledge__text { font-size: 0.78rem; color: var(--text-dim); line-height: 1.9; font-weight: 300; }

  .hint { position: fixed; right: 3.5rem; bottom: 3rem; z-index: 10; text-align: right; }
  .hint__text { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.15em; line-height: 2; }
  .hint__text span { color: var(--gold); }

  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(10,10,12,0.85); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s; backdrop-filter: blur(8px); }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal__inner { text-align: center; transform: translateY(20px); transition: transform 0.5s cubic-bezier(0.2,0.8,0.2,1); }
  .modal.show .modal__inner { transform: translateY(0); }
  .modal__seal { width: 80px; height: 80px; margin: 0 auto 1.5rem; border: 2px solid var(--gold); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--gold); transform: rotate(-5deg); }
  .modal__title { font-size: 1.6rem; font-weight: 900; color: var(--paper); letter-spacing: 0.3em; margin-bottom: 0.8rem; }
  .modal__desc { font-size: 0.85rem; color: var(--text-dim); line-height: 2; max-width: 320px; margin: 0 auto 2rem; font-weight: 300; }
  .modal__btn { padding: 0.8rem 2.5rem; background: transparent; border: 1px solid var(--gold); color: var(--gold); font-family: 'Noto Serif SC', serif; font-size: 0.85rem; letter-spacing: 0.2em; cursor: pointer; transition: all 0.3s; }
  .modal__btn:hover { background: var(--gold); color: var(--ink); }

  @media (max-width: 900px) {
    .nav { padding: 1rem; } .nav__links { gap: 1rem; }
    .back-btn { top: 4.5rem; left: 1rem; }
    .title-block { top: 6rem; left: 1rem; } .title-block__main { font-size: 1.2rem; }
    .color-picker { left: 1rem; } .tools { right: 1rem; }
    .knowledge, .hint { display: none; }
    .face-container { width: 60vw; height: auto; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav class="nav">
  <div class="nav__logo">薪火</div>
  <div class="nav__links">
    <a href="index.html">首页</a>
    <a href="hall.html">展馆</a>
    <a href="craftsman.html">匠人</a>
    <a href="easter-egg.html" class="active">技艺互动</a>
  </div>
</nav>

<a href="easter-egg.html" class="back-btn">← 返回技艺</a>

<div class="title-block">
  <div class="title-block__main">勾 脸</div>
  <div class="title-block__sub">JINGJU MAKEUP</div>
  <div class="title-block__line"></div>
</div>

<div class="stage">
  <div class="face-container">
    <svg class="face-svg" viewBox="0 0 400 500" id="faceSvg">
      <defs>
        <radialGradient id="faceGlow" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#e8dcc8" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#e8dcc8" stop-opacity="0.02"/>
        </radialGradient>
      </defs>
      <ellipse cx="200" cy="250" rx="150" ry="190" fill="url(#faceGlow)"/>
      <path d="M 200 60 Q 80 80 70 220 Q 65 350 140 430 Q 200 470 260 430 Q 335 350 330 220 Q 320 80 200 60 Z" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.4"/>

      <g class="region" data-region="forehead"><path d="M 200 75 Q 160 80 140 110 L 150 160 Q 200 145 250 160 L 260 110 Q 240 80 200 75 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="leftBrow"><path d="M 100 160 Q 130 140 170 155 L 165 185 Q 130 180 105 175 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="rightBrow"><path d="M 300 160 Q 270 140 230 155 L 235 185 Q 270 180 295 175 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="leftEye"><path d="M 95 190 Q 115 175 155 185 Q 165 205 150 220 Q 115 225 95 190 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="rightEye"><path d="M 305 190 Q 285 175 245 185 Q 235 205 250 220 Q 285 225 305 190 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="leftCheek"><path d="M 105 235 Q 100 310 145 360 Q 170 375 180 350 Q 165 290 160 240 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="rightCheek"><path d="M 295 235 Q 300 310 255 360 Q 230 375 220 350 Q 235 290 240 240 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="nose"><path d="M 200 175 L 188 270 Q 200 280 212 270 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="mouth"><path d="M 165 375 Q 200 388 235 375 Q 232 405 200 410 Q 168 405 165 375 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>
      <g class="region" data-region="chin"><path d="M 175 420 Q 200 440 225 420 L 235 455 Q 200 475 165 455 Z" fill="#1a1a1a" stroke="#c9a96e" stroke-width="0.8" opacity="0.85"/></g>

      <path d="M 100 155 Q 135 135 175 150" stroke="#c9a96e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <path d="M 300 155 Q 265 135 225 150" stroke="#c9a96e" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="125" cy="200" rx="10" ry="5" fill="#0a0a0c"/>
      <ellipse cx="275" cy="200" rx="10" ry="5" fill="#0a0a0c"/>
      <circle cx="125" cy="200" r="2.5" fill="#c9a96e"/>
      <circle cx="275" cy="200" r="2.5" fill="#c9a96e"/>
      <path d="M 200 90 L 190 120 L 200 130 L 210 120 Z" fill="#c9a96e" opacity="0.5"/>
    </svg>
  </div>
</div>

<div class="color-picker">
  <div class="color-picker__label">色 彩</div>
  <div class="color-dots" id="colorDots">
    <div class="color-dot active" data-color="#c8102e" style="background:#c8102e; color:#c8102e" title="朱红 · 忠勇"></div>
    <div class="color-dot" data-color="#1a1a1a" style="background:#1a1a1a; color:#1a1a1a" title="墨黑 · 刚直"></div>
    <div class="color-dot" data-color="#e8dcc8" style="background:#e8dcc8; color:#e8dcc8" title="雪白 · 奸诈"></div>
    <div class="color-dot" data-color="#c9a96e" style="background:#c9a96e; color:#c9a96e" title="金黄 · 神佛"></div>
    <div class="color-dot" data-color="#2a5a9e" style="background:#2a5a9e; color:#2a5a9e" title="宝蓝 · 豪爽"></div>
    <div class="color-dot" data-color="#2d6a4f" style="background:#2d6a4f; color:#2d6a4f" title="翠绿 · 义侠"></div>
  </div>
</div>

<div class="tools">
  <div>
    <div class="tool-section__label">谱 式</div>
    <div class="preset-list">
      <button class="preset-item" data-preset="guanyu">关羽</button>
      <button class="preset-item" data-preset="baozheng">包拯</button>
      <button class="preset-item" data-preset="caocao">曹操</button>
      <button class="preset-item" data-preset="sunwukong">猴王</button>
    </div>
  </div>
  <div>
    <div class="tool-section__label">操 作</div>
    <div class="action-row">
      <button class="btn btn--ghost" id="clearBtn">清 空</button>
      <button class="btn btn--primary" id="finishBtn">完 成</button>
    </div>
  </div>
</div>

<div class="knowledge">
  <div class="knowledge__title">脸谱之说</div>
  <div class="knowledge__text">红表忠勇，白显奸邪，黑示刚直。一色一纹，皆为人物心性之写照。</div>
</div>

<div class="hint">
  <div class="hint__text">点击脸谱区域上色<br>试试<span>经典谱式</span>一键生成</div>
</div>

<div class="modal" id="modal">
  <div class="modal__inner">
    <div class="modal__seal">印</div>
    <div class="modal__title">勾 脸 初 成</div>
    <div class="modal__desc">笔落惊风雨，墨成见忠奸。你笔下的这张脸谱，已是一段人物心事。</div>
    <button class="modal__btn" id="modalClose">再 画 一 幅</button>
  </div>
</div>

<script>
let scene, camera, renderer, particleSystem;
let mouseX = 0, mouseY = 0;

function initThree() {
  const canvas = document.getElementById('bg-canvas');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a0c, 0.008);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.z = 60;
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const count = 500;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const col = new Float32Array(count*3);
  const gold = new THREE.Color(0xc9a96e);
  const cream = new THREE.Color(0xe8dcc8);
  const dim = new THREE.Color(0x3a3528);

  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5)*120;
    pos[i*3+1] = (Math.random()-0.5)*100;
    pos[i*3+2] = (Math.random()-0.5)*60;
    const r = Math.random();
    const c = r > 0.85 ? gold : r > 0.5 ? cream : dim;
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const c2 = document.createElement('canvas');
  c2.width = c2.height = 64;
  const ctx2 = c2.getContext('2d');
  const g = ctx2.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,255,255,0.5)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx2.fillStyle = g; ctx2.fillRect(0,0,64,64);

  const mat = new THREE.PointsMaterial({ size: 0.5, map: new THREE.CanvasTexture(c2), vertexColors: true, transparent: true, opacity: 0.7, depthWrite: false, blending: THREE.AdditiveBlending });
  particleSystem = new THREE.Points(geo, mat);
  scene.add(particleSystem);

  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX/window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY/window.innerHeight - 0.5) * 2;
  });
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  particleSystem.rotation.y += 0.0003;
  particleSystem.rotation.x += (mouseY*0.02 - particleSystem.rotation.x) * 0.02;
  particleSystem.rotation.y += (mouseX*0.03 - particleSystem.rotation.y) * 0.02;
  renderer.render(scene, camera);
}

function particleBurst() {
  const count = 400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const vels = [];
  for (let i = 0; i < count; i++) {
    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
    vels.push({ x:(Math.random()-0.5)*3, y:(Math.random()-0.5)*3, z:(Math.random()-0.5)*2 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ size: 1, color: 0xc9a96e, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending });
  const burst = new THREE.Points(geo, mat);
  scene.add(burst);
  let p = 0;
  function anim() {
    p += 0.015;
    const arr = burst.geometry.attributes.position.array;
    for (let i = 0; i < count; i++) {
      arr[i*3] += vels[i].x * p;
      arr[i*3+1] += vels[i].y * p;
      arr[i*3+2] += vels[i].z * p;
    }
    burst.geometry.attributes.position.needsUpdate = true;
    mat.opacity = 1 - p;
    if (p < 1) requestAnimationFrame(anim);
    else { scene.remove(burst); geo.dispose(); mat.dispose(); }
  }
  anim();
}

let currentColor = '#c8102e';
const regions = document.querySelectorAll('.region');
const dots = document.querySelectorAll('.color-dot');

dots.forEach(dot => {
  dot.addEventListener('click', () => {
    dots.forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    currentColor = dot.dataset.color;
  });
});

regions.forEach(region => {
  const path = region.querySelector('path');
  region.addEventListener('click', () => {
    gsap.fromTo(path, { opacity: 0.4, scale: 0.98 }, { opacity: 0.9, scale: 1, duration: 0.4, ease: 'power2.out' });
    path.setAttribute('fill', currentColor);
  });
});

const presets = {
  guanyu: { forehead:'#c8102e', leftBrow:'#1a1a1a', rightBrow:'#1a1a1a', leftEye:'#1a1a1a', rightEye:'#1a1a1a', leftCheek:'#c8102e', rightCheek:'#c8102e', nose:'#c8102e', mouth:'#1a1a1a', chin:'#c8102e' },
  baozheng: { forehead:'#1a1a1a', leftBrow:'#1a1a1a', rightBrow:'#1a1a1a', leftEye:'#1a1a1a', rightEye:'#1a1a1a', leftCheek:'#1a1a1a', rightCheek:'#1a1a1a', nose:'#1a1a1a', mouth:'#e8dcc8', chin:'#1a1a1a' },
  caocao: { forehead:'#e8dcc8', leftBrow:'#1a1a1a', rightBrow:'#1a1a1a', leftEye:'#1a1a1a', rightEye:'#1a1a1a', leftCheek:'#e8dcc8', rightCheek:'#e8dcc8', nose:'#e8dcc8', mouth:'#1a1a1a', chin:'#e8dcc8' },
  sunwukong: { forehead:'#e8dcc8', leftBrow:'#c9a96e', rightBrow:'#c9a96e', leftEye:'#c9a96e', rightEye:'#c9a96e', leftCheek:'#e8dcc8', rightCheek:'#e8dcc8', nose:'#c8102e', mouth:'#1a1a1a', chin:'#e8dcc8' }
};

document.querySelectorAll('.preset-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = presets[btn.dataset.preset];
    Object.entries(p).forEach(([region, color]) => {
      const el = document.querySelector(`[data-region="${region}"] path`);
      if (el) gsap.to(el, { fill: color, duration: 0.6, ease: 'power2.inOut' });
    });
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  regions.forEach(r => gsap.to(r.querySelector('path'), { fill: '#1a1a1a', duration: 0.4 }));
});

document.getElementById('finishBtn').addEventListener('click', () => {
  particleBurst();
  document.getElementById('modal').classList.add('show');
});
document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});

window.addEventListener('load', () => {
  gsap.from('.title-block', { opacity: 0, x: -30, duration: 1, delay: 0.3 });
  gsap.from('.color-picker', { opacity: 0, x: -30, duration: 1, delay: 0.5 });
  gsap.from('.tools', { opacity: 0, x: 30, duration: 1, delay: 0.5 });
  gsap.from('.face-container', { opacity: 0, scale: 0.9, duration: 1.2, delay: 0.2, ease: 'power2.out' });
});

initThree();
</script>
</body>
</html>
