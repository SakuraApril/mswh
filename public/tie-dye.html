<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扎染 · 技艺互动 | 薪火非遗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Cinzel:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://lib.baomitu.com/three.js/0.160.0/three.min.js"></script>
<script src="js/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #c9a96e;
    --ink: #0a0a0c;
    --paper: #e8dcc8;
    --text: #d4cdc0;
    --text-dim: #6b6558;
  }
  body, html { height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: 'Noto Serif SC', serif; }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, rgba(42,90,158,0.08) 0%, transparent 60%);
  }
  #bg-canvas { position: fixed; inset: 0; z-index: 1; }

  .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1.8rem 3.5rem; }
  .nav__logo { font-size: 0.9rem; letter-spacing: 0.3em; color: var(--gold); font-weight: 300; }
  .nav__links { display: flex; gap: 2.5rem; }
  .nav__links a { font-size: 0.78rem; color: var(--text-dim); text-decoration: none; letter-spacing: 0.2em; transition: color 0.3s; font-weight: 300; }
  .nav__links a:hover { color: var(--text); }
  .nav__links a.active { color: var(--gold); }

  .back-btn { position: fixed; top: 6rem; left: 3.5rem; z-index: 10; font-size: 0.78rem; color: var(--text-dim); text-decoration: none; letter-spacing: 0.2em; transition: color 0.3s; }
  .back-btn:hover { color: var(--gold); }

  .title-block { position: fixed; top: 8rem; left: 3.5rem; z-index: 10; }
  .title-block__main { font-size: 1.8rem; font-weight: 900; letter-spacing: 0.4em; color: var(--paper); line-height: 1.2; }
  .title-block__sub { margin-top: 0.8rem; font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.3em; font-family: 'Cinzel', serif; }
  .title-block__line { width: 40px; height: 1px; background: #2a5a9e; margin-top: 1rem; }

  .stage { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; }
  .cloth-container { position: relative; width: min(55vh, 450px); height: min(55vh, 450px); }
  #clothCanvas {
    width: 100%; height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 80px rgba(42,90,158,0.2);
    cursor: crosshair;
  }

  .color-picker { position: fixed; left: 3.5rem; top: 50%; transform: translateY(-50%); z-index: 20; }
  .color-picker__label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.3em; margin-bottom: 1.2rem; text-align: center; }
  .color-dots { display: flex; flex-direction: column; gap: 0.9rem; align-items: center; }
  .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); position: relative; }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.active { transform: scale(1.2); box-shadow: 0 0 20px currentColor; border-color: rgba(255,255,255,0.4); }
  .color-dot.active::after { content: ''; position: absolute; inset: -6px; border: 1px solid rgba(42,90,158,0.3); border-radius: 50%; animation: ring 2s infinite; }
  @keyframes ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  .tools-right { position: fixed; right: 3.5rem; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 1.5rem; }
  .tool-section__label { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.3em; margin-bottom: 0.8rem; text-align: right; }
  .action-row { display: flex; flex-direction: column; gap: 0.6rem; }
  .btn { padding: 0.7rem 1.5rem; border-radius: 2px; cursor: pointer; font-family: 'Noto Serif SC', serif; font-size: 0.8rem; letter-spacing: 0.2em; transition: all 0.3s; }
  .btn--primary { background: #2a5a9e; color: #fff; border: none; font-weight: 600; }
  .btn--primary:hover { box-shadow: 0 0 30px rgba(42,90,158,0.4); }
  .btn--ghost { background: transparent; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.15); }
  .btn--ghost:hover { border-color: var(--text-dim); color: var(--text); }

  .knowledge { position: fixed; left: 3.5rem; bottom: 3rem; z-index: 10; max-width: 260px; }
  .knowledge__title { font-size: 0.75rem; color: #2a5a9e; letter-spacing: 0.2em; margin-bottom: 0.5rem; }
  .knowledge__text { font-size: 0.78rem; color: var(--text-dim); line-height: 1.9; font-weight: 300; }

  .hint { position: fixed; right: 3.5rem; bottom: 3rem; z-index: 10; text-align: right; }
  .hint__text { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.15em; line-height: 2; }
  .hint__text span { color: #2a5a9e; }

  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(10,10,12,0.85); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s; backdrop-filter: blur(8px); }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal__inner { text-align: center; transform: translateY(20px); transition: transform 0.5s cubic-bezier(0.2,0.8,0.2,1); }
  .modal.show .modal__inner { transform: translateY(0); }
  .modal__seal { width: 80px; height: 80px; margin: 0 auto 1.5rem; border: 2px solid #2a5a9e; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #2a5a9e; transform: rotate(-5deg); }
  .modal__title { font-size: 1.6rem; font-weight: 900; color: var(--paper); letter-spacing: 0.3em; margin-bottom: 0.8rem; }
  .modal__desc { font-size: 0.85rem; color: var(--text-dim); line-height: 2; max-width: 320px; margin: 0 auto 2rem; font-weight: 300; }
  .modal__btn { padding: 0.8rem 2.5rem; background: transparent; border: 1px solid #2a5a9e; color: #2a5a9e; font-family: 'Noto Serif SC', serif; font-size: 0.85rem; letter-spacing: 0.2em; cursor: pointer; transition: all 0.3s; }
  .modal__btn:hover { background: #2a5a9e; color: #fff; }

  @media (max-width: 900px) {
    .nav { padding: 1rem; } .nav__links { gap: 1rem; }
    .back-btn { top: 4.5rem; left: 1rem; }
    .title-block { top: 6rem; left: 1rem; } .title-block__main { font-size: 1.2rem; }
    .color-picker { left: 1rem; } .tools-right { right: 1rem; }
    .knowledge, .hint { display: none; }
    .cloth-container { width: 60vw; height: 60vw; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<nav class="nav">
  <div class="nav__logo">薪火</div>
  <div class="nav__links">
    <a href="index.html">首页</a>
    <a href="hall.html">展馆</a>
    <a href="craftsman.html">匠人</a>
    <a href="easter-egg.html" class="active">技艺互动</a>
  </div>
</nav>

<a href="easter-egg.html" class="back-btn">← 返回技艺</a>

<div class="title-block">
  <div class="title-block__main">扎 染</div>
  <div class="title-block__sub">TIE-DYE</div>
  <div class="title-block__line"></div>
</div>

<div class="stage">
  <div class="cloth-container">
    <canvas id="clothCanvas" width="600" height="600"></canvas>
  </div>
</div>

<div class="color-picker">
  <div class="color-picker__label">染 料</div>
  <div class="color-dots" id="colorDots">
    <div class="color-dot active" data-color="#2a5a9e" style="background:#2a5a9e; color:#2a5a9e" title="靛蓝"></div>
    <div class="color-dot" data-color="#c8102e" style="background:#c8102e; color:#c8102e" title="茜红"></div>
    <div class="color-dot" data-color="#c9a96e" style="background:#c9a96e; color:#c9a96e" title="藤黄"></div>
    <div class="color-dot" data-color="#6b4423" style="background:#6b4423; color:#6b4423" title="茶褐"></div>
    <div class="color-dot" data-color="#2d6a4f" style="background:#2d6a4f; color:#2d6a4f" title="艾绿"></div>
  </div>
</div>

<div class="tools-right">
  <div>
    <div class="tool-section__label">操 作</div>
    <div class="action-row">
      <button class="btn btn--ghost" id="clearBtn">褪 色</button>
      <button class="btn btn--primary" id="finishBtn">染 成</button>
    </div>
  </div>
</div>

<div class="knowledge">
  <div class="knowledge__title">扎染之说</div>
  <div class="knowledge__text">
    白布入靛，扎结之处不着色。一扎一染，晕出山河纹理。
  </div>
</div>

<div class="hint">
  <div class="hint__text">
    点击白布滴染<br>层层叠加<span>晕染天成</span>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal__inner">
    <div class="modal__seal">染</div>
    <div class="modal__title">扎 染 初 成</div>
    <div class="modal__desc">
      青出于蓝，晕于布上。你染出的每一道纹路，都是独一无二的山河。
    </div>
    <button class="modal__btn" id="modalClose">再 染 一 匹</button>
  </div>
</div>

<script>
// Three.js 粒子背景
let scene, camera, renderer, particleSystem;
let mouseX = 0, mouseY = 0;

function initThree() {
  const canvas = document.getElementById('bg-canvas');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a0c, 0.008);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.z = 60;
  renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const count = 400;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const col = new Float32Array(count*3);
  const blue = new THREE.Color(0x2a5a9e);
  const cream = new THREE.Color(0xe8dcc8);
  const dim = new THREE.Color(0x283848);

  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random()-0.5)*120;
    pos[i*3+1] = (Math.random()-0.5)*100;
    pos[i*3+2] = (Math.random()-0.5)*60;
    const r = Math.random();
    const c = r > 0.7 ? blue : r > 0.4 ? cream : dim;
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

  const c2 = document.createElement('canvas');
  c2.width = c2.height = 64;
  const ctx2 = c2.getContext('2d');
  const g = ctx2.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,255,255,0.4)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx2.fillStyle = g; ctx2.fillRect(0,0,64,64);

  const mat = new THREE.PointsMaterial({ size: 0.5, map: new THREE.CanvasTexture(c2), vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending });
  particleSystem = new THREE.Points(geo, mat);
  scene.add(particleSystem);

  window.addEventListener('mousemove', e => {
    mouseX = (e.clientX/window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY/window.innerHeight - 0.5) * 2;
  });
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  animate();
}

function animate() {
  requestAnimationFrame(animate);
  particleSystem.rotation.y += 0.0003;
  particleSystem.rotation.x += (mouseY*0.02 - particleSystem.rotation.x) * 0.02;
  particleSystem.rotation.y += (mouseX*0.03 - particleSystem.rotation.y) * 0.02;
  renderer.render(scene, camera);
}

function dyeBurst() {
  const count = 300;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count*3);
  const vels = [];
  for (let i = 0; i < count; i++) {
    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
    vels.push({ x:(Math.random()-0.5)*3, y:(Math.random()-0.5)*3, z:(Math.random()-0.5)*2 });
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ size: 0.8, color: 0x2a5a9e, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending });
  const burst = new THREE.Points(geo, mat);
  scene.add(burst);
  let p = 0;
  function anim() {
    p += 0.015;
    const arr = burst.geometry.attributes.position.array;
    for (let i = 0; i < count; i++) {
      arr[i*3] += vels[i].x * p;
      arr[i*3+1] += vels[i].y * p;
      arr[i*3+2] += vels[i].z * p;
    }
    burst.geometry.attributes.position.needsUpdate = true;
    mat.opacity = 1 - p;
    if (p < 1) requestAnimationFrame(anim);
    else { scene.remove(burst); geo.dispose(); mat.dispose(); }
  }
  anim();
}

// ===== 扎染 Canvas =====
const canvas = document.getElementById('clothCanvas');
const ctx = canvas.getContext('2d');
let currentColor = '#2a5a9e';

// 初始化白布
function drawBase() {
  ctx.fillStyle = '#e8dcc8';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // 布纹质感
  for (let i = 0; i < 500; i++) {
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.03})`;
    ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 1, 1);
  }
}
drawBase();

// 滴染
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  // 径向晕染
  const radius = 80 + Math.random() * 40;
  const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);

  // hex 转 rgba
  const r = parseInt(currentColor.slice(1,3), 16);
  const g = parseInt(currentColor.slice(3,5), 16);
  const b = parseInt(currentColor.slice(5,7), 16);

  gradient.addColorStop(0, `rgba(${r},${g},${b},0.6)`);
  gradient.addColorStop(0.5, `rgba(${r},${g},${b},0.25)`);
  gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);

  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
});

// 颜色选择
const dots = document.querySelectorAll('.color-dot');
dots.forEach(dot => {
  dot.addEventListener('click', () => {
    dots.forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    currentColor = dot.dataset.color;
  });
});

// 清空
document.getElementById('clearBtn').addEventListener('click', drawBase);

// 完成
document.getElementById('finishBtn').addEventListener('click', () => {
  dyeBurst();
  document.getElementById('modal').classList.add('show');
});
document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
  drawBase();
});

// 入场动画
window.addEventListener('load', () => {
  gsap.from('.title-block', { opacity: 0, x: -30, duration: 1, delay: 0.3 });
  gsap.from('.color-picker', { opacity: 0, x: -30, duration: 1, delay: 0.5 });
  gsap.from('.tools-right', { opacity: 0, x: 30, duration: 1, delay: 0.5 });
  gsap.from('.cloth-container', { opacity: 0, scale: 0.9, duration: 1.2, delay: 0.2, ease: 'power2.out' });
});

initThree();
</script>
</body>
</html>
