<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅兰芳 · 京剧大师 | 薪火非遗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { height: 100%; overflow: hidden; background: #050505; color: #e8e8e8; font-family: 'Noto Serif SC', serif; }

  /* 背景字母画布 */
  #letters-canvas { position: fixed; inset: 0; z-index: 1; }

  /* 中央人像 */
  .portrait {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 5; width: 420px; height: 580px;
    background: radial-gradient(ellipse at center, rgba(168,85,247,0.15) 0%, transparent 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .portrait__img {
    width: 100%; height: 100%; object-fit: cover; opacity: 0.75;
    filter: contrast(1.3) brightness(0.85) saturate(0.8) hue-rotate(-10deg);
    mask-image: radial-gradient(ellipse at center, black 50%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 50%, transparent 85%);
  }
  .portrait__wireframe {
    position: absolute; inset: 0;
    background:
      linear-gradient(rgba(139,92,246,0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,92,246,0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  /* 左侧内容 */
  .left-panel {
    position: fixed; top: 0; left: 0; z-index: 10;
    padding: 3rem 3.5rem; max-width: 480px;
  }
  .left-panel__title {
    font-size: 3.5rem; font-weight: 900; letter-spacing: 0.1em;
    color: #f0f0f0; margin-bottom: 1.5rem; line-height: 1.1;
  }
  .left-panel__bio {
    font-size: 0.85rem; line-height: 1.9; color: #999;
    margin-bottom: 2.5rem; letter-spacing: 0.05em;
  }
  .left-panel__section-title {
    font-size: 1.2rem; font-weight: 600; color: #ddd;
    margin-bottom: 1.2rem; letter-spacing: 0.1em;
  }
  .timeline { display: flex; flex-direction: column; gap: 1rem; }
  .timeline__item {
    display: flex; gap: 1.2rem; font-size: 0.8rem; line-height: 1.6;
  }
  .timeline__year {
    color: #a855f7; font-weight: 600; min-width: 90px;
    letter-spacing: 0.05em;
  }
  .timeline__desc { color: #888; }

  /* 右侧标签 */
  .tags-panel {
    position: fixed; top: 0; right: 0; z-index: 10;
    padding: 3rem 3.5rem;
  }
  .tag {
    position: relative;
    padding: 0.5rem 1rem; border: 1px solid #444; border-radius: 2px;
    font-size: 0.75rem; letter-spacing: 0.1em; color: #ccc;
    margin-bottom: 2rem; background: rgba(0,0,0,0.6);
    cursor: pointer; transition: all 0.3s;
  }
  .tag:hover { border-color: #a855f7; color: #fff; }
  .tag::before {
    content: ''; position: absolute; right: -60px; top: 50%;
    width: 60px; height: 1px; background: #333;
  }
  .tag--1 { transform: translateY(0); }
  .tag--2 { transform: translateY(30px); margin-right: 2rem; }
  .tag--3 { transform: translateY(60px); margin-right: 4rem; }
  .tag--4 { transform: translateY(90px); margin-right: 2rem; }

  /* 返回按钮 */
  .back-btn {
    position: fixed; bottom: 2rem; left: 2.5rem; z-index: 100;
    padding: 0.7rem 1.5rem; border: 1px solid #555; border-radius: 2px;
    color: #ccc; font-size: 0.8rem; letter-spacing: 0.1em;
    background: transparent; cursor: pointer; transition: all 0.3s;
    text-decoration: none;
  }
  .back-btn:hover { border-color: #a855f7; color: #fff; }
</style>
</head>
<body>
  <canvas id="letters-canvas"></canvas>

  <!-- 中央人像 -->
  <div class="portrait">
    <div class="portrait__wireframe"></div>
    <img src="images/meilanfang.jpg" alt="梅兰芳贵妃醉酒剧照" class="portrait__img">
  </div>

  <!-- 左侧：简介 + 时间线 -->
  <div class="left-panel">
    <h1 class="left-panel__title">梅兰芳</h1>
    <p class="left-panel__bio">
      名澜，字畹华。中国京剧表演艺术大师，"梅派"艺术创始人。
      他以男旦之身，将京剧推向世界舞台，被列为"世界三大表演体系"之一。
      一生演过百余出戏，塑造了无数经典女性形象。
    </p>
    <h2 class="left-panel__section-title">生平年表</h2>
    <div class="timeline">
      <div class="timeline__item">
        <span class="timeline__year">1894</span>
        <span class="timeline__desc">出生于北京京剧世家，8岁学戏</span>
      </div>
      <div class="timeline__item">
        <span class="timeline__year">1913</span>
        <span class="timeline__desc">首次赴上海演出，轰动上海滩</span>
      </div>
      <div class="timeline__item">
        <span class="timeline__year">1930</span>
        <span class="timeline__desc">赴美演出，将京剧介绍给世界</span>
      </div>
      <div class="timeline__item">
        <span class="timeline__year">1950</span>
        <span class="timeline__desc">任中国京剧院院长，致力于传承</span>
      </div>
      <div class="timeline__item">
        <span class="timeline__year">1961</span>
        <span class="timeline__desc">逝世，享年67岁</span>
      </div>
    </div>
  </div>

  <!-- 右侧标签 -->
  <div class="tags-panel">
    <div class="tag tag--1">贵妃醉酒</div>
    <div class="tag tag--2">霸王别姬</div>
    <div class="tag tag--3">牡丹亭</div>
    <div class="tag tag--4">梅派传人</div>
  </div>

  <!-- 返回 -->
  <a href="index.html" class="back-btn">← 返回首页</a>

<script>
// ==================== 漂浮汉字背景 ====================
const canvas = document.getElementById('letters-canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const chars = '京剧梅兰芳贵妃醉酒霸王别姬牡丹亭水袖凤冠旦角生净末丑唱念做打西皮二黄锣鼓胡琴脸谱髯口翎子祥云如意';
const charCount = 200;
const particles = [];

for (let i = 0; i < charCount; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 14 + Math.random() * 28,
    speedX: (Math.random() - 0.5) * 0.3,
    speedY: (Math.random() - 0.5) * 0.2,
    opacity: 0.05 + Math.random() * 0.2,
    color: Math.random() < 0.6 ? '#a855f7' : (Math.random() < 0.5 ? '#6366f1' : '#ec4899'),
    char: chars[Math.floor(Math.random() * chars.length)]
  });
}

let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX - W / 2) * 0.001;
  mouseY = (e.clientY - H / 2) * 0.001;
});

function animate() {
  ctx.clearRect(0, 0, W, H);

  particles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;

    // 鼠标视差
    p.x += mouseX * p.size * 0.1;
    p.y += mouseY * p.size * 0.1;

    // 边界循环
    if (p.x < -50) p.x = W + 50;
    if (p.x > W + 50) p.x = -50;
    if (p.y < -50) p.y = H + 50;
    if (p.y > H + 50) p.y = -50;

    ctx.font = p.size + 'px "Noto Serif SC", serif';
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.opacity;
    ctx.fillText(p.char, p.x, p.y);
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
